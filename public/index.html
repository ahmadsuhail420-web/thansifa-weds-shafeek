<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1410" />
<title>Thansifa &amp; Shafeek</title>

<link rel="preload" as="image" href="image/w-poster.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet" />

<style>
  :root{
    --ivory:#f7f1e6;
    --champagne:#e8d6b3;
    --gold:#c9a35b;
    --gold-soft:#d8bd82;
    --ink:#1a1410;
    --sans:'Josefin Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --serif:'Cormorant Garamond', 'Times New Roman', serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    background:var(--ink);
    color:var(--ivory);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  img,video{display:block;max-width:100%;}

  /* Full-screen sizing with mobile-safe viewport units */
  .fullscreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:100dvh;
  }

  /* ===== WELCOME SCENE ===== */
  #welcome{
    z-index:20;
    background:var(--ink);
    transition:opacity 1.4s var(--ease);
  }
  #welcome.gone{opacity:0;pointer-events:none;}

  #welcome video, #welcome .poster{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  #welcome-video{opacity:0;transition:opacity 1.2s var(--ease);}
  #welcome-video.playing{opacity:1;}

  .poster{
    z-index:2;
    opacity:1;
    transition:opacity 1.3s var(--ease);
    will-change:opacity;
  }
  .poster.fade-out{opacity:0;pointer-events:none;}

  /* subtle vignette so the cue reads over any frame */
  .scrim{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(180deg, rgba(10,7,4,.15) 0%, transparent 45%, rgba(10,7,4,.55) 100%);
  }

  /* Tap cue (functional prompt only) */
  .tap-prompt{
    position:absolute;
    inset:0;
    z-index:4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:0 24px calc(12vh + env(safe-area-inset-bottom));
    text-align:center;
    opacity:0;
    transition:opacity 1.1s var(--ease);
  }
  .tap-prompt.show{opacity:1;}
  .tap-prompt.hide{opacity:0;pointer-events:none;}

  .tap-cta{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.1rem;
  }
  .tap-cta-text{
    font-family:var(--sans);
    font-weight:300;
    letter-spacing:.24em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--ivory);
    text-shadow:0 2px 18px rgba(0,0,0,.6);
    padding-left:.24em;
  }
  .tap-ring{
    width:52px;height:52px;border-radius:50%;
    border:1px solid var(--gold-soft);
    position:relative;
    display:grid;place-items:center;
  }
  .tap-ring::before{
    content:"";
    position:absolute;inset:-1px;border-radius:50%;
    border:1px solid var(--gold);
    animation:ripple 2.6s var(--ease) infinite;
  }
  .tap-ring::after{
    content:"";
    width:9px;height:9px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 18px var(--gold-soft);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes ripple{
    0%{transform:scale(1);opacity:.7}
    70%{transform:scale(1.9);opacity:0}
    100%{opacity:0}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.85}
    50%{transform:scale(1.35);opacity:1}
  }

  /* ===== HERO SCENE ===== */
  #hero{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;height:100svh;min-height:100dvh;
    overflow:hidden;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    opacity:0;
    visibility:hidden;
    z-index:10;
    transition:opacity 1.6s var(--ease);
  }
  #hero.reveal{opacity:1;visibility:visible;}

  /* --- masthead on the white band --- */
  .hero-header{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:calc(4.5vh + env(safe-area-inset-top)) 24px 2.2vh;
  }
  .hero-eyebrow{
    font-family:var(--sans);
    font-weight:300;
    letter-spacing:.42em;
    text-transform:uppercase;
    font-size:.62rem;
    color:var(--gold);
    padding-left:.42em;
  }
  .hero-mono{
    width:clamp(58px,19vw,92px);
    height:auto;
    margin:1rem 0 .85rem;
  }
  .hero-names{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(1.7rem,8.2vw,2.7rem);
    line-height:1.1;
    color:var(--ink);
  }
  .hero-names .amp{
    font-style:italic;
    color:var(--gold);
    margin:0 .22em;
  }

  /* --- video fills whatever the masthead leaves, sitting at the bottom --- */
  .hero-media{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }
  .hero-media video{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    z-index:1;
  }
  /* scrim is scoped to the media box so the white band stays clean */
  #hero .scrim{
    z-index:2;
    background:linear-gradient(180deg, transparent 55%, rgba(10,7,4,.42) 100%);
  }

  /* Scroll cue (functional cue only) */
  .scroll-cue{
    position:absolute;
    left:50%;bottom:calc(4vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:.7rem;
    opacity:0;
    animation:rise 1.2s var(--ease) 1.4s forwards;
    text-decoration:none;
  }
  .scroll-cue .label{
    font-family:var(--sans);font-weight:300;
    letter-spacing:.28em;text-transform:uppercase;
    font-size:.6rem;color:var(--ivory);opacity:.9;
    padding-left:.28em;
    text-shadow:0 2px 14px rgba(0,0,0,.6);
  }
  .scroll-cue .mouse{
    width:22px;height:34px;border-radius:12px;
    border:1px solid var(--gold-soft);
    position:relative;
  }
  .scroll-cue .mouse::after{
    content:"";position:absolute;left:50%;top:7px;
    width:3px;height:7px;border-radius:2px;background:var(--gold);
    transform:translateX(-50%);
    animation:scroll-dot 1.8s var(--ease) infinite;
  }
  @keyframes rise{to{opacity:1;transform:translate(-50%,0)}}
  @keyframes scroll-dot{
    0%{opacity:0;transform:translate(-50%,0)}
    35%{opacity:1}
    70%{opacity:0;transform:translate(-50%,10px)}
    100%{opacity:0}
  }

  /* Fallback control if autoplay is blocked */
  .autoplay-fallback{
    position:fixed;
    left:50%;bottom:calc(6vh + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:40;
    display:none;
    align-items:center;gap:.6rem;
    padding:.85rem 1.5rem;
    border:1px solid var(--gold-soft);
    border-radius:999px;
    background:rgba(12,8,5,.6);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--ivory);
    font-family:var(--sans);font-weight:300;
    letter-spacing:.2em;text-transform:uppercase;font-size:.66rem;
    cursor:pointer;
  }
  .autoplay-fallback.show{display:inline-flex;}
  .autoplay-fallback .play-tri{
    width:0;height:0;border-style:solid;
    border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--gold);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition-duration:.3s !important;}
  }
</style>
</head>
<body>

  <!-- ===================== WELCOME SCENE ===================== -->
  <div id="welcome" class="fullscreen" role="button" tabindex="0" aria-label="Tap to begin our story">
    <video id="welcome-video" playsinline muted preload="auto" webkit-playsinline
           src="video/w-bg.mp4"></video>

    <img class="poster" id="poster" src="image/w-poster.webp" alt="" />

    <div class="scrim"></div>

    <div class="tap-prompt" id="tapPrompt">
      <div class="tap-cta">
        <span class="tap-cta-text">Tap to begin our story</span>
        <span class="tap-ring" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <!-- ===================== HERO SCENE ===================== -->
  <div id="hero">
    <header class="hero-header">
      <p class="hero-eyebrow">The Wedding Of</p>
      <img class="hero-mono" src="image/mono.webp" alt="" />
      <h1 class="hero-names">Thanseefa<span class="amp">&amp;</span>Shafeek</h1>
    </header>

    <div class="hero-media">
      <video id="hero-video" playsinline muted loop preload="auto" webkit-playsinline
             src="video/h-bg.mp4"></video>
      <div class="scrim"></div>
    </div>

    <div class="scroll-cue" aria-hidden="true">
      <span class="label">Scroll to explore</span>
      <span class="mouse"></span>
    </div>
  </div>

  <!-- Fallback control if autoplay is blocked by the browser -->
  <button class="autoplay-fallback" id="autoplayFallback" type="button">
    <span class="play-tri" aria-hidden="true"></span>
    <span>Play</span>
  </button>

<script>
(function(){
  "use strict";

  var welcome       = document.getElementById('welcome');
  var welcomeVideo  = document.getElementById('welcome-video');
  var poster        = document.getElementById('poster');
  var tapPrompt     = document.getElementById('tapPrompt');
  var hero          = document.getElementById('hero');
  var heroVideo     = document.getElementById('hero-video');
  var fallbackBtn   = document.getElementById('autoplayFallback');

  var started   = false;   // welcome interaction consumed
  var revealed  = false;   // hero already revealed
  var promptTimer = null;  // delayed reveal of the tap cue

  // Belt-and-braces for reliable mobile inline playback
  [welcomeVideo, heroVideo].forEach(function(v){
    v.muted = true;
    v.setAttribute('muted','');
    v.playsInline = true;
  });

  function showFallback(){ fallbackBtn.classList.add('show'); }
  function hideFallback(){ fallbackBtn.classList.remove('show'); }

  // ---- Reveal the hero scene once the welcome video finishes ----
  function revealHero(){
    if (revealed) return;
    revealed = true;

    welcome.classList.add('gone');
    hero.classList.add('reveal');

    var p = heroVideo.play();
    if (p && typeof p.catch === 'function'){
      p.catch(function(){
        showFallback();
        fallbackBtn.onclick = function(){
          heroVideo.play().then(hideFallback).catch(function(){});
        };
      });
    }

    setTimeout(function(){
      if (welcome && welcome.parentNode) welcome.parentNode.removeChild(welcome);
    }, 1600);
  }

  // ---- Start the welcome video on first interaction ----
  function beginStory(){
    if (started) return;            // prevent replay of the intro interaction
    started = true;

    clearTimeout(promptTimer);
    tapPrompt.classList.remove('show');
    tapPrompt.classList.add('hide');
    poster.classList.add('fade-out');
    welcomeVideo.classList.add('playing');

    removeInteractionListeners();

    var p = welcomeVideo.play();
    if (p && typeof p.catch === 'function'){
      p.catch(function(){
        showFallback();
        fallbackBtn.onclick = function(){
          welcomeVideo.play().then(hideFallback).catch(function(){});
        };
      });
    }

    setTimeout(function(){
      if (poster && poster.parentNode) poster.parentNode.removeChild(poster);
    }, 1400);
  }

  function onKey(e){
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      beginStory();
    }
  }

  function removeInteractionListeners(){
    welcome.removeEventListener('touchstart', beginStory);
    welcome.removeEventListener('click', beginStory);
    welcome.removeEventListener('keydown', onKey);
  }

  // Surface the cue after 2s, only if the guest hasn't already interacted.
  promptTimer = setTimeout(function(){
    if (!started) tapPrompt.classList.add('show');
  }, 2000);

  welcome.addEventListener('touchstart', beginStory, {passive:true});
  welcome.addEventListener('click', beginStory);
  welcome.addEventListener('keydown', onKey);

  welcomeVideo.addEventListener('ended', revealHero);

  // Safety net: if the video errors after starting, still progress.
  welcomeVideo.addEventListener('error', function(){
    if (started && !revealed) revealHero();
  });

})();
</script>
</body>
</html>
